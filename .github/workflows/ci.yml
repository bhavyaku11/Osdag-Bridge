name: OsdagBridge CI

on:
  push:
    branches: [ main, dev, "feature/**" ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Run Automated Tests & Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e ".[dev]"

      - name: Install LaTeX Compiler (for PDF generation verification)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended

      - name: Run Pytest Suite
        run: |
          pytest -v

      - name: Verify CLI Console Scripts
        run: |
          osdagbridge version
          osdagbridge-cli version
          osdagbridge analyze resources/sample_bridge_model.json
          osdagbridge-cli boq resources/sample_bridge_model.json

      - name: Run 25-Scenario Functional Test Matrix
        run: |
          python3 tests/run_functional_tests.py
